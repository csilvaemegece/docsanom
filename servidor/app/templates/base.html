<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SACA - Anonimizador{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='anonimizador/css/saca.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand">S.A.C.A.</div>
        <div class="brand-sub">SISTEMA DE AUTOMATIZACIÓN<br>DE CORTES DE APELACIONES</div>
      </div>

      <nav class="side-nav">
        <div class="nav-section-label">ANONIMIZADOR</div>

        <a class="nav-item {{ 'active' if active_page == 'anonimizador' else '' }}"
           href="{{ url_for('main.anonimizador') }}#anonimizar" data-vista="anonimizar">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12h6"/>
            </svg>
          </span>
          <span>Anonimizar causa</span>
        </a>

        <a class="nav-item" href="{{ url_for('main.anonimizador') }}#restaurar" data-vista="restaurar">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
            </svg>
          </span>
          <span>Restaurar respuesta</span>
        </a>
      </nav>

      <p class="sidebar-note">El documento se procesa en este equipo. No se sube al servidor.</p>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="breadcrumb">
          <span>S.A.C.A.</span>
          <span class="sep">›</span>
          <span>{% block breadcrumb %}{% endblock %}</span>
        </div>
        <div class="clock" id="clock"></div>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
    function tickClock() {
      const el = document.getElementById("clock");
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }
    tickClock();
    setInterval(tickClock, 1000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
